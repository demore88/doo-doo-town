name: Build Android app
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build AAB (signed afterwards with the upload key, kept off GitHub) and a debug APK to sideload
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doo-doo-town-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
      - name: Put the builds on the android-builds branch (split into 40 MB pieces)
        run: |
          mkdir -p $RUNNER_TEMP/out && cd $RUNNER_TEMP/out
          cp $GITHUB_WORKSPACE/android/app/build/outputs/bundle/release/app-release.aab doo-doo-town.aab
          cp $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk doo-doo-town-test.apk
          for f in *.aab *.apk; do split -b 40m -d "$f" "$f.part"; rm "$f"; done
          sha256sum $GITHUB_WORKSPACE/android/app/build/outputs/bundle/release/app-release.aab $GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS
          echo "${{ github.run_number }}" > BUILD
          git init -q -b android-builds && git add -A
          git -c user.name=build -c user.email=build@users.noreply.github.com commit -qm "Build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
