{ // the thumbstick: origin is wherever your thumb lands; direction is how far you slide from there

}
function fitIntro() {   // shrink the text until the whole how-to fits on one screen
  const b = $('#introbox'); if (!b || !b.offsetParent) return;
  let fs = Math.min(17, b.clientWidth / 46); b.style.fontSize = fs + 'px';
  while (fs > 5 && (b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1)) { fs -= 0.5; b.style.fontSize = fs + 'px'; }
}
addEventListener('resize', () => { if (phase === 'intro') fitIntro(); });
function toMenu() { phase = 'menu'; screen('menu'); $('#quit').style.display = 'none'; showPad(); buildGrid(); }
function quit() { if (SOLO) return DDT.nav(DDT.back('index.html')); openIntro(cur); }
$('#quit').onclick = quit;
const NO_K = new Set(['kitty', 'beads', 'septic', 'pour', 'stairs', 'crawl', 'detective', 'flush', 'poop', 'superron', 'steamer']);   // games with no speed knob of their own: their clock runs a little faster instead
function start() {
  const G = GAMES[cur];
  s = { hero, H: HEROES[hero], diff, k: DIFF_K[diff], rnd: rng((Date.now() ^ (cur * 7919)) >>> 0), t: 0, shake: 0, room: DDT.param('room') || '', camera: DDT.param('cam') === '1', item: DDT.param('item') || '' };   // room: kitchen = black grease, not brown
  { // fair challenge: a game you keep acing gets a little tougher; one you keep failing eases off a little
    const aced = Math.min(4, store.get('aced_' + G.id) || 0), fails = Math.min(3, store.get('fails_' + G.id) || 0);
    s.adapt = Math.max(0.85, Math.min(1.2, 1 + aced * 0.05 - fails * 0.05)); }
  G.init(s);
  if (NO_K.has(G.id)) s.spd = s.adapt; else s.k *= s.adapt;   /* after init, so games that set their own s.k still get it */ if (DDT.param('boots') === '1' && s.pantsMax) { s.pantsMax++; s.pants++; }   // boots or waders: one more pair of pants in the messy games
  for (const k in held) { held[k] = 0; edge[k] = 0; } ptr.down = false; ptr.clicked = false;
  phase = G.noReady ? 'play' : 'ready'; readyT = 1.6; screen(''); $('#quit').style.display = ''; showPad();   /* noReady: slow, story-ish games just start, no GET READY / GO! */
}
function finish() {
  const G = GAMES[cur], e = s.end; phase = 'result'; showPad(); store.set('seen_' + G.id, 1);
  const key = G.id + '_' + diff, prev = store.get(key) || 0, newBest = e.win && e.stars > prev; if (newBest) store.set(key, e.stars);
  const streak = e.win ? (store.get('streak') || 0) + 1 : 0; store.set('streak', streak);
  if (e.win) { store.set('fails_' + G.id, 0); if (e.stars === 3) store.set('aced_' + G.id, (store.get('aced_' + G.id) || 0) + 1); } else { store.set('fails_' + G.id, (store.get('fails_' + G.id) || 0) + 1); store.set('aced_' + G.id, Math.max(0, (store.get('aced_' + G.id) || 0) - 1)); }   // wins in a row, across games
  if (e.win) { for (let i = 0; i < e.stars; i++) setTimeout(() => beep([659, 784, 1047][i], .14), 380 + i * 300); if (e.stars === 3) setTimeout(() => { beep(1319, .3); }, 1300); }   // one ding per star, rising
  else { beep(196, .4, 'sawtooth', .05, -80); }
  const starHtml = e.win ? [0, 1, 2].map(i => i < e.stars ? `<span class="on" style="animation-delay:${0.38 + i * 0.3}s">★</span>` : '<span class="off">☆</span>').join('') : '<span class="off">☆☆☆</span>';
  const extra = (newBest && prev ? '<div class="best">NEW BEST!</div>' : e.win && e.stars === 3 ? '<div class="best">PERFECT JOB!</div>' : '') + (streak >= 3 ? `<div class="best">${streak} IN A ROW!</div>` : '')
    + (!e.win ? `<div class="tip">TIP: ${G.how[Math.min(G.how.length - 1, 1 + Math.floor(Math.random() * (G.how.length - 1)))]}</div>` : e.stars < 3 ? '<div class="tip">3 stars is out there. Cleaner and faster.</div>' : '');
  $('#resbox').innerHTML = `<div class="big" style="color:${e.win ? '#7bd65b' : '#e9665a'}">${e.win ? 'JOB DONE!' : 'NOT THIS TIME'}</div>
    <div class="stars">${starHtml}</div>
    <p style="text-align:center">${e.line}</p>${extra}
    <div class="row"><button class="btn" id="again">RETRY</button>${cur < GAMES.length - 1 ? '<button class="btn" id="next">NEXT GAME &gt;</button>' : ''}<button class="btn" id="all">ALL GAMES</button></div>`;
  screen('result'); $('#quit').style.display = 'none';
  $('#again').onclick = start; $('#all').onclick = toMenu; if ($('#next')) $('#next').onclick = () => openIntro(cur + 1);
  $('#again').focus();
  if (EMBED) {
    if (!SOLO) store.set('mg', { id: G.id, win: !!e.win, stars: e.win ? e.stars : 0, carl: !!e.carl, extraTime: e.extraTime || 0, at: Date.now() });
    $('#resbox .row').innerHTML = SOLO ? '<button class="btn" id="again2">PLAY AGAIN</button><button class="btn" id="cont">MAIN MENU</button>' : '<button class="btn" id="cont">CONTINUE &gt;</button>';
    if (SOLO) $('#again2').onclick = start;
    $('#cont').onclick = () => { DDT.nav(DDT.back('play.html')); }; $('#cont').focus();
  }
}

// ---------- loop ----------
let prevShake = 0, prevPants = null, endT = 0;
function frame(ms) {
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.imageSmoothingEnabled = false;
  const dt = Math.min(1 / 30, (ms - last) / 1000 || 0); last = ms;
  if (phase === 'ready' || phase === 'play' || phase === 'result' || phase === 'ending') {
    const G = GAMES[cur];
    if (phase === 'play') {
      const I = { L: held.L, R: held.R, U: held.U, D: held.D, A: held.A, B: held.B, Lp: edge.L, Rp: edge.R, Up: edge.U, Dp: edge.D, Ap: edge.A, Bp: edge.B, ptr: { ...ptr } };
      for (const k in edge) edge[k] = 0; ptr.clicked = false;
      if (I.Ap) beep(880, .03, 'square', .025);
      G.update(s, dt * (s.spd || 1), I);
      if ((s.shake || 0) > prevShake + 0.01) beep(110, .18, 'sawtooth', .06, -40);
      prevShake = s.shake || 0;
      if (s.end) { phase = 'ending'; endT = 0.75; if (s.end.win) beep(880, .08); }   // hold on the final moment before the results slide in
    } else if (phase === 'ending') { endT -= dt; if (s.fx || s.pops) { try { if (typeof FX === 'function') FX(s, dt); } catch (e) {} } if (endT <= 0) finish();
    } else if (phase === 'ready') { readyT -= dt; for (const k in edge) edge[k] = 0; ptr.clicked = false; if (readyT <= 0) { phase = 'play'; beep(1046, .1); } }
    g.save();
    if (s.shake > 0) { s.shake = Math.max(0, s.shake - dt); g.translate((Math.random() - .5) * 6, (Math.random() - .5) * 6); }
    G.draw(s, {}); g.restore();
    if (phase === 'ending') { const k = Math.max(0, endT / 0.75); if (s.end.win) { g.globalAlpha = k * k * 0.55; R(0, 0, W, H, '#fff'); g.globalAlpha = 1; } else { g.globalAlpha = (1 - k) * 0.5; R(0, 0, W, H, '#200'); g.globalAlpha = 1; } }
    if (phase === 'ready') { const go = readyT <= 0.8, k = go ? 1 + Math.max(0, readyT - 0.55) * 2.4 : 1; R(0, 110, W, 50, 'rgba(16,21,31,.85)'); T(go ? 'GO!' : 'GET READY', 240, 135, go ? '#7dffb0' : '#f7c418', 16 * k, 'center'); }
  } else { R(0, 0, W, H, '#0b0e15'); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && phase === 'play') { for (const k in held) held[k] = 0; openIntro(cur); } });

// ---------- boot ----------
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = r; i.src = src; });
const loadMG = () => fetch('../assets/mg/sizes.json').then(r => r.json()).then(o => Promise.all(Object.keys(o).map(n => load('mg_' + n, '../assets/mg/' + n + '.png')))).catch(() => {});
const capped = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);   // art helps, but never holds up the game
Promise.all([capped(loadMG(), 2500), load('matt', '../assets/matt_dance.png'), load('matt_more', '../assets/matt_more.png'), load('ron_sheet', '../assets/ron_sheet.png'), load('rod_port', '../assets/rod_normal.png'), ...['stare', 'annoyed', 'confused', 'gross', 'smug', 'laugh', 'shocked', 'happy', 'tired', 'panic', 'normal'].map(f => load('rodf_' + f, '../assets/rod_' + f + '.png')), load('matt_walk', '../assets/matt_walk.png'), load('rod_walk', '../assets/rod_walk.png'), load('rod', '../assets/rod_dance.png'), load('rod_more', '../assets/rod_more.png'), load('van', '../assets/van_left.png'), load('van_back', '../assets/van_back.png'), load('bg_yard3', '../assets/bg_yard3.png'),
  document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : 0]).then(() => {
    buildGrid(); requestAnimationFrame(frame);
    if (EMBED) { const i = GAMES.findIndex(x => x.id === EMBED); if (i >= 0) { openIntro(i); if (store.get('seen_' + EMBED)) start(); }   /* played it before: skip the how-to, straight to READY */
      $('#home').textContent = '< BACK'; }
    if (DDT.param('lead')) $('#heroes').style.display = 'none';
  });
showPad();
</script>
