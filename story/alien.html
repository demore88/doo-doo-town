<script>

// =====================================================================
// STORY JOB: OUT OF THIS WORLD — Rod gets abducted to fix a space toilet.
// Scenes can be opened directly for testing: alien.html?scene=window|beam|lang|toilet|cable|reveal|dropoff
// =====================================================================
const W = 480, H = 270, cv = document.getElementById('c');
let g = cv.getContext('2d');
const SCALE = 3;   // draw at 3x so text is sharp; all game coordinates stay 480x270

function T(s, x, y, c = '#fff', n = 8, al = 'left', sh = true) {
  g.font = FONT(n); g.textAlign = al; g.textBaseline = 'middle';

}
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
// portraits not preloaded (rod_angry, ron_smug...) load the first time someone uses that face
const _portBase = (() => { const e = document.querySelector('script[src*="js/state.js"]'); return e ? e.src.replace(/js\/state\.js.*$/, 'assets/') : '../assets/'; })();
function portLoad(name) { if (!name || name in portLoad.c) return portLoad.c[name] || null; portLoad.c[name] = null; const i = new Image(); i.onload = () => { portLoad.c[name] = IMG[name] = i; }; i.src = _portBase + name + '.png'; return null; }
portLoad.c = {};
const IMG = {};
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- sound (Web Audio, unlocked on first tap) ----------
let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }

}
const SND = {
  chirp(n = 3) { for (let i = 0; i < n; i++) tone(rnd(700, 1500), 0.07, 'square', 0.035, i * 0.09, rnd(500, 1800)); },
  blip() { tone(880, 0.05, 'square', 0.03); },
  good() { tone(660, 0.08, 'square', 0.04); tone(990, 0.12, 'square', 0.04, 0.08); },

};
if (typeof DDTSfx !== 'undefined') DDTSfx.patch(SND);   // recorded sounds where we have them

// ---------- input ----------
const keys = {}, hit = {};
addEventListener('keydown', e => { if (!keys[e.key]) hit[e.key] = true; keys[e.key] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); ac(); });

const ptr = { x: 0, y: 0, down: false, clicked: false };
function toCanvas(e) { const b = cv.getBoundingClientRect(); ptr.x = (e.clientX - b.left) / b.width * W; ptr.y = (e.clientY - b.top) / b.height * H; }

// ---------- scene runner: every wait/line/tween can be cancelled by SKIP ----------
let RUN = 0, pend = new Set(), tweens = [], dialog = null, game = null, view = () => {}, st = {};
function cancellable(exec) {
  return new Promise((res, rej) => { const h = { rej }; pend.add(h); exec(v => { if (pend.has(h)) { pend.delete(h); res(v); } }); });
}
function cancelAll() { pend.forEach(h => h.rej('skip')); pend.clear(); tweens = []; dialog = null; game = null; }
const wait = ms => cancellable(res => setTimeout(res, ms));
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function tween(o, k, to, ms, fn = ease) { return cancellable(res => tweens.push({ o, k, from: o[k], to, ms, t: 0, fn, res })); }
function say(name, port, text, opts) { return cancellable(res => { dialog = { name, port, text, shown: 0, opts, sel: 0, res }; }); }
function play(gm) { return cancellable(res => { game = gm; gm.done = v => { game = null; res(v); }; gm.init && gm.init(); }); }
async function card(lines, ms = 2200, col = '#f7c418') { st.card = lines; st.cardCol = col; await tween(st, 'cardA', 1, 400); await wait(ms); await tween(st, 'cardA', 0, 400); }
const fadeIn = (ms = 600) => tween(st, 'fade', 0, ms), fadeOut = (ms = 600) => tween(st, 'fade', 1, ms);

const ORDER = ['window', 'beam', 'lang', 'toilet', 'cable', 'reveal', 'dropoff'];
const NAMES = { window: 'THE WINDOW', beam: 'BEAM ME UP', lang: 'LEARN THE LINGO', toilet: 'THE SPACE TOILET', cable: 'CABLE THE HOSE', reveal: 'THE CULPRIT', dropoff: 'THE DROP-OFF' };
let cur = 0, score = { wrong: 0, retries: 0, snags: 0 };
async function runFrom(i) {
  cancelAll(); const tok = ++RUN;
  for (; i < ORDER.length; i++) {
    cur = i; st = { fade: 1, cardA: 0 }; view = () => R(0, 0, W, H, '#000');
    try { await SCENES[ORDER[i]](); } catch (e) { if (e !== 'skip') console.error(e); return; }
    if (tok !== RUN) return;
  }
  location.href = DDT.back('index.html');
}

// ---------- characters ----------
function rod(x, y, f = 0, s = 2, a = 1) {      // x,y = feet, center
  if (!IMG.rod) return; g.globalAlpha = a;
  g.drawImage(IMG.rod, f * 24, 0, 24, 40, Math.round(x - 12 * s), Math.round(y - 40 * s), 24 * s, 40 * s); g.globalAlpha = 1;
}
// gray alien. o: {s, wave, point:[tx,ty], tilt, blink, sad}
function alien(x, y, o = {}) {
  const s = o.s || 1, t = performance.now() / 1000;
  g.save(); g.translate(x, y); g.scale(s, s);
  // body
  R(-7, -34, 14, 22, '#8d9a8a'); R(-6, -12, 5, 12, '#7c8879'); R(1, -12, 5, 12, '#7c8879');
  R(-8, -34, 16, 3, '#6b7a68');
  // arms
  g.strokeStyle = '#8d9a8a'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-7, -30); g.lineTo(-12, -16); g.stroke();
  if (o.point) {
    const [tx, ty] = o.point, ang = Math.atan2((ty - y) / s + 30, (tx - x) / s - 7);
    g.beginPath(); g.moveTo(7, -30); g.lineTo(7 + Math.cos(ang) * 16, -30 + Math.sin(ang) * 16); g.stroke();
    g.lineWidth = 1.5; g.beginPath(); g.moveTo(7 + Math.cos(ang) * 16, -30 + Math.sin(ang) * 16); g.lineTo(7 + Math.cos(ang) * 23, -30 + Math.sin(ang) * 23); g.stroke();
  } else if (o.wave) {
    const a = -1.9 + Math.sin(t * 6) * 0.35;
    g.beginPath(); g.moveTo(7, -30); g.lineTo(7 + Math.cos(a) * 12, -30 + Math.sin(a) * 12); g.stroke();
    g.lineWidth = 1.5; const b = a + Math.sin(t * 9) * 0.6;
    g.beginPath(); g.moveTo(7 + Math.cos(a) * 12, -30 + Math.sin(a) * 12); g.lineTo(7 + Math.cos(a) * 12 + Math.cos(b - 0.6) * 7, -30 + Math.sin(a) * 12 + Math.sin(b - 0.6) * 7); g.stroke();

}
function alienPortrait() {

  k.fillStyle = '#2a1f4a'; k.fillRect(0, 0, 80, 80); k.fillStyle = '#3a2d63'; for (let i = 0; i < 80; i += 8) k.fillRect(0, i, 80, 2);

}
// alien words are drawn as 5x5 pixel glyphs
const GLYPH = {
  you:    ['10001', '01010', '00100', '01010', '10001'],
  me:     ['01110', '10001', '10101', '10001', '01110'],
  toilet: ['11111', '10001', '01110', '00100', '01110'],
  broken: ['10100', '01011', '00100', '11010', '00101'],
  fix:    ['00011', '00111', '01110', '11100', '11000'],
  home:   ['00100', '01110', '11111', '01010', '01110'],
  no:     ['11011', '11011', '00000', '11011', '11011'],

}

  if (label) label.forEach((l, i) => T(l, x - w / 2 + px * 3 + i * (px * 8) + px * 2.5, y - 9, '#f7c418', 5, 'center', false));
}

// ---------- backdrops ----------
const STARS = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * 170, Math.random()]);

  R(0, 200, W, 70, '#2a2030'); for (let x = 0; x < W; x += 40) R(x, 200, 1, 70, '#33283b');

  else { R(wx, wy, ww, wh, '#0a1030'); stars((x, y) => x > wx && x < wx + ww && y > wy && y < wy + wh); }
  R(wx + 6, wy + wh - 22, 22, 22, '#0b1a10'); R(wx + 60, wy + wh - 30, 18, 30, '#0b1a10');
  st.windowDraw && st.windowDraw(wx, wy, ww, wh);
  R(wx - 4, wy - 4, ww + 8, 4, '#6b5a40'); R(wx - 4, wy + wh, ww + 8, 6, '#6b5a40'); R(wx - 4, wy, 4, wh, '#6b5a40'); R(wx + ww, wy, 4, wh, '#6b5a40');
  R(wx + ww / 2 - 1, wy, 3, wh, '#6b5a40'); R(wx, wy + wh / 2 - 1, ww, 3, '#6b5a40');
  R(wx - 14, wy - 8, 12, wh + 20, '#5a2e3a'); R(wx + ww + 2, wy - 8, 12, wh + 20, '#5a2e3a');
  // door
  R(16, 92, 44, 108, '#4a3826'); R(20, 96, 36, 100, '#5a4430'); R(50, 146, 4, 4, '#d6b24a');
  // TV
  const t = performance.now() / 1000, flick = dawn ? 0 : 0.5 + 0.5 * Math.sin(t * 13) * Math.sin(t * 7.3);
  R(84, 168, 54, 32, '#2a2a2a'); R(86, 128, 50, 38, '#111'); R(90, 132, 42, 30, dawn ? '#222' : `rgb(${60 + flick * 50},${90 + flick * 60},${150 + flick * 80})`);
  if (!dawn) { g.fillStyle = `rgba(120,160,255,${0.05 + flick * 0.05})`; g.beginPath(); g.moveTo(132, 132); g.lineTo(300, 110); g.lineTo(300, 230); g.lineTo(132, 162); g.fill(); }
}
function bed(front) {
  if (!front) { R(150, 150, 8, 55, '#4a3018'); R(150, 176, 160, 24, '#5a3a1e'); R(162, 160, 40, 14, '#e8e4dc'); return; }
  R(150, 170, 160, 24, '#2c4f8c'); R(150, 170, 160, 4, '#3d63a8'); for (let x = 160; x < 310; x += 22) R(x, 176, 10, 2, '#24427a');
  R(302, 160, 8, 45, '#4a3018');
}
function shipRoom() {
  R(0, 0, W, H, '#1e1638'); for (let x = 0; x < W; x += 40) { R(x, 0, 2, 200, '#2a1f4a'); R(x + 18, 20, 4, 4, '#4b3a80'); }
  R(0, 200, W, 70, '#141026'); for (let x = 0; x < W; x += 30) R(x, 200, 28, 2, '#2b2350');
  const t = performance.now() / 1000;
  for (let x = 20; x < W; x += 60) R(x, 6, 30, 3, (Math.floor(t * 3 + x) % 3) ? '#5b49a6' : '#7dffb0');
  // porthole with Earth
  E(60, 72, 30, 30, '#4b3a80'); E(60, 72, 25, 25, '#05070c'); stars((x, y) => (x - 60) ** 2 + (y - 72) ** 2 < 600);
  E(66, 78, 13, 13, '#2c6cd6'); E(62, 74, 5, 4, '#4caf50'); E(70, 82, 4, 3, '#4caf50');
}
function sparkPanel(x, y) {
  R(x - 18, y - 14, 36, 28, '#2b2350'); R(x - 14, y - 10, 28, 20, '#0d0a1a');
  g.strokeStyle = '#e9665a'; g.lineWidth = 1; g.beginPath(); g.moveTo(x - 10, y - 8); g.lineTo(x + 2, y + 2); g.lineTo(x - 4, y + 4); g.lineTo(x + 10, y + 9); g.stroke();
  if (Math.random() < 0.25) for (let i = 0; i < 4; i++) R(x + rnd(-14, 14), y + rnd(-10, 12), 2, 2, '#f7c418');
}
function toiletDoor(x) { R(x - 22, 96, 44, 104, '#2b2350'); R(x - 18, 100, 36, 100, '#3a2d63'); R(x - 1, 100, 2, 100, '#1e1638'); R(x - 10, 82, 20, 12, '#0d0a1a'); R(x - 4, 85, 8, 4, '#7dffb0'); R(x - 2, 89, 4, 3, '#7dffb0'); }
function toolBag(x, y) { R(x - 14, y - 12, 28, 12, '#c0392b'); R(x - 10, y - 16, 20, 4, '#1a1a1a'); R(x - 12, y - 8, 24, 2, '#8b2a1f'); R(x + 4, y - 22, 3, 10, '#aaa'); }
function spaceToilet(x, y, hoseT = 0) {
  R(x - 10, y - 30, 20, 30, '#c9ced6'); R(x - 6, y - 30, 4, 30, '#e8ecf2');
  E(x, y - 36, 22, 9, '#e8ecf2'); E(x, y - 37, 16, 5, '#5a6378'); R(x - 22, y - 37, 44, 2, '#c9ced6');
  R(x - 2, y - 72, 26, 26, '#c9ced6'); R(x + 2, y - 68, 18, 6, '#7dffb0');
  // ribbed hose coming out of the bowl and coiling up
  const tw = Math.sin(hoseT * 18) * (hoseT > 0 ? 2 : 0);
  g.strokeStyle = '#8a93a5'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - 14, y - 38); g.bezierCurveTo(x - 40, y - 38, x - 44, y - 80, x - 26 + tw, y - 92); g.stroke();
  g.strokeStyle = '#a9b2c4'; g.lineWidth = 2; g.setLineDash([2, 3]);
  g.beginPath(); g.moveTo(x - 14, y - 38); g.bezierCurveTo(x - 40, y - 38, x - 44, y - 80, x - 26 + tw, y - 92); g.stroke(); g.setLineDash([]);
  R(x - 30 + tw, y - 100, 8, 10, '#5a6378'); R(x - 28 + tw, y - 104, 4, 5, '#7dffb0');
}

// ---------- dialog box ----------
function drawDialog() {
  const d = dialog; if (!d) return;
  d.shown = Math.min(d.text.length, d.shown + 1.1);
  R(6, 180, W - 12, 86, '#10151f'); g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(7.5, 181.5, W - 15, 83);
  const p = d.port === 'alien' ? IMG.alienP : (IMG[d.port] || portLoad(d.port));
  R(12, 184, 80, 80, '#2a3346'); if (p) g.drawImage(p, 12, 184, 80, 80);
  g.strokeStyle = '#f7c418'; g.lineWidth = 2; g.strokeRect(12, 184, 80, 80);
  T(d.name, 102, 194, '#f7c418', 8);
  const lines = wrap(d.text.slice(0, Math.floor(d.shown)), 360, 8);
  lines.forEach((l, i) => T(l, 102, 210 + i * 13, '#fff', 8));
  const done = d.shown >= d.text.length;
  if (done && d.opts) {
    const top = 210 + Math.max(1, wrap(d.text, 360, 8).length) * 13 - 2;
    d.boxes = d.opts.map((o, i) => [100, top + i * 13, 368, 12]);
    if (pressed('ArrowUp')) d.sel = (d.sel + d.opts.length - 1) % d.opts.length;
    if (pressed('ArrowDown')) d.sel = (d.sel + 1) % d.opts.length;
    d.opts.forEach((o, i) => { const [x, y, w, h] = d.boxes[i]; R(x, y, w, h, i === d.sel ? '#2c6cd6' : '#1d2638'); T((i === d.sel ? '> ' : '  ') + o, x + 4, y + 6, '#fff', 6, 'left', false); });
  } else if (done && Math.floor(performance.now() / 400) % 2) T('▼'.replace('▼', 'v'), 462, 256, '#f7c418', 8, 'right');
}
function dialogInput() {
  const d = dialog; if (!d) return false;
  const done = d.shown >= d.text.length;
  if (!(ptr.clicked || confirmHit())) return true;
  if (!done) { d.shown = d.text.length; return true; }
  if (!d.opts) { dialog = null; SND.blip(); d.res(0); return true; }
  let pick = null;
  if (ptr.clicked && d.boxes) d.boxes.forEach(([x, y, w, h], i) => { if (inBox(x, y, w, h)) pick = i; });
  if (confirmHit()) pick = d.sel;
  if (pick !== null) { dialog = null; SND.blip(); d.res(pick); }
  return true;

const LEN = 2300, SPD = 70, HX = 130;

const hw = x => Math.max(26, 32 + 7 * Math.sin(x / 95));
const CableGame = {
  init() {
    this.d = 0; this.y = yc(HX); this.snags = 0; this.stall = 0; this.trail = []; this.t = 0; this.junk = []; this.max = 6; this.hitT = 0; this.ready = 2;

  },
  update(dt) {

    const v = this.stall > 0 ? 0 : SPD; this.d = Math.min(LEN, this.d + v * dt);

    let dy = 0; if (keys.ArrowUp || keys.w || keys.W) dy -= 1; if (keys.ArrowDown || keys.s || keys.S) dy += 1;
    if (ptr.down && !dy) { const diff = ptr.y - this.y; dy = Math.abs(diff) < 2 ? 0 : Math.sign(diff); }
    this.y += dy * rate * dt;

    const c = yc(wx), w = hw(wx);
    let snag = Math.abs(this.y - c) > w - 5;
    for (const j of this.junk) if (!j.hit && Math.abs(j.x - wx) < j.r + 4 && Math.abs(yc(j.x) + j.off * hw(j.x) - this.y) < j.r + 4) { j.hit = true; snag = true; }
    if (snag && this.hitT <= 0) { this.snags++; score.snags++; this.stall = 0.6; this.hitT = 1.0; SND.snag(); }
    if (Math.abs(this.y - c) > w - 4) this.y = c + Math.sign(this.y - c) * (w - 6);

  },
  draw() {

    if (gx < W + 40) { for (let i = 0; i < 9; i++) E(gx + (i % 3) * 7, yc(LEN + HX + 20) - 12 + i * 3, 9, 7, i % 2 ? '#5a3a1c' : '#6b4423'); T('CLOG', gx + 8, yc(LEN + HX + 20) - 30, '#f7c418', 6, 'center'); }
    for (const j of this.junk) {

  await say('ROD', 'rod_gross', '...Somebody flushed a tampon.');
  st.holo = 0.01; SND.chirp(2); await tween(st, 'holo', 1, 500);
  st.sad = true; st.tilt = 0.25; await wait(1600);
  await say('ROD', 'rod_laugh', "Yeah. It's always the last guest.");
  await tween(st, 'holo', 0, 400); st.sad = false; st.tilt = 0;
  DDTSfx.play('flush_big'); await wait(1200); st.happy = true; SND.chirp(6);
  await say('ROD', 'rod_happy', 'There she goes. Tell your friends: only flush the three P\'s. Pee, poo, and paper.');
  await say('ROD', 'rod_happy', 'Even in space.');
  await fadeOut(700);
};

SCENES.dropoff = async () => {
  Object.assign(st, { rodDY: -140, beam: 0, inBed: true });
  view = () => {
    bedroom(true); bed(false);
    if (st.beam > 0) { g.fillStyle = `rgba(125,255,176,${0.2 * st.beam})`; g.fillRect(170, 0, 56, 200); }
    g.save(); g.beginPath(); g.rect(0, 0, W, 172); g.clip(); rod(196, 200 + st.rodDY, 0); g.restore();
    bed(true);
  };
  await fadeIn(700);
  await card(['6:58 AM'], 900);
  SND.beam(); await tween(st, 'beam', 1, 300);
  await tween(st, 'rodDY', 0, 1600);
  await tween(st, 'beam', 0, 400);
  await wait(800);
  tone(880, 0.1, 'square', 0.04); tone(880, 0.1, 'square', 0.04, 0.25); tone(880, 0.1, 'square', 0.04, 0.5);
  await wait(900);
  await fadeOut(500);
  view = () => { R(0, 0, W, H, '#0e1118'); };
  await fadeIn(300);
  await card(['7:41 AM · THE VAN'], 900);
  await say('MATT', 'matt_suspicious', "You're late. And you look like you saw a ghost.");
  await say('ROD', 'rod_stare', '...');
  await say('ROD', 'rod_stare', "Don't ask.");
  await say('MATT', 'matt_normal', '...Why do you smell like ozone?');
  view = () => {
    R(0, 0, W, H, '#0e1118');
    R(110, 40, 260, 170, '#10151f'); g.strokeStyle = '#f7c418'; g.lineWidth = 3; g.strokeRect(111.5, 41.5, 257, 167);
    T('STORY JOB COMPLETE', 240, 62, '#f7c418', 9, 'center');
    T('OUT OF THIS WORLD', 240, 82, '#fff', 7, 'center');
    T('NEW TOOL: GRAVITY AUGER', 240, 112, '#7dffb0', 7, 'center');
    T('+ REPUTATION (GALACTIC)', 240, 130, '#7dffb0', 7, 'center');
    T(`WRONG WORDS ${score.wrong}  ·  SNAGS ${score.snags}`, 240, 152, '#9fb3d9', 5, 'center');
    T(DDT.inCampaign() ? 'TAP TO CONTINUE' : 'TAP TO RETURN TO MENU', 240, 186, '#fff', 6, 'center');
  };
  SND.ding();
  if (DDT.inCampaign()) DDT.apply({ rep: 5, money: 0, stamina: -30, item: { gravityauger: 1 }, time: 60, note: 'Abducted. Fixed a space toilet. Do not ask Rod about it.' });
  await cancellable(res => { st.waitTap = res; });
};

// =====================================================================
// main loop
// =====================================================================
let last = performance.now(), started = false;
function frame(now) {
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.imageSmoothingEnabled = false;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const tw of tweens.slice()) {
    tw.t += dt * 1000; const p = Math.min(1, tw.t / tw.ms); tw.o[tw.k] = tw.from + (tw.to - tw.from) * tw.fn(p);
    if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  // buttons first
  if (started && ptr.clicked && inBox(...BTN.menu)) { location.href = DDT.root + (DDT.inCampaign() ? 'play.html' : 'index.html'); return; }
  if (started && DDT.DEV && ptr.clicked && inBox(...BTN.skip)) { ptr.clicked = false; runFrom(cur + 1); }
  if (!started) {
    R(0, 0, W, H, '#05070c'); stars();
    T('STORY JOB', 240, 90, '#9fb3d9', 8, 'center'); T('OUT OF THIS WORLD', 240, 116, '#f7c418', 16, 'center');
    if (Math.floor(now / 500) % 2) T('TAP TO START', 240, 170, '#fff', 8, 'center');
    if (ptr.clicked || confirmHit()) { started = true; ac(); const q = new URLSearchParams(location.search).get('scene'); runFrom(Math.max(0, ORDER.indexOf(q))); }
  } else {
    view();
    if (game) { const gm = game; gm.update(dt); gm.draw(); }   // update may finish the game and clear it
    else if (!dialogInput() && st.waitTap && (ptr.clicked || confirmHit())) { const f = st.waitTap; st.waitTap = null; f(); }
    drawDialog();
    if (st.cardA > 0) { g.globalAlpha = st.cardA; const CL = st.card.flatMap(l => wrap(String(l), 450, 9)); R(0, 80, W, 34 + (CL.length - 1) * 16, '#000000cc'); CL.forEach((l, i) => T(l, 240, 98 + i * 16, st.cardCol, 9, 'center')); g.globalAlpha = 1; }
    if (st.fade > 0) { g.globalAlpha = st.fade; R(0, 0, W, H, '#000'); g.globalAlpha = 1; }
    drawButtons();
  }
  ptr.clicked = false; for (const k in hit) delete hit[k];
  requestAnimationFrame(frame);
}
Promise.all([load('../assets/rod_dance.png'), load('../assets/van_left.png'), load('../assets/rod_normal.png'), load('../assets/rod_happy.png'),
  load('../assets/matt_normal.png'), load('../assets/matt_suspicious.png'), document.fonts.load(FONT(8)).catch(() => {})])
  .then(([rd, van, rn, rh, mn, ms]) => {
    Object.assign(IMG, { rod: rd, van, rod_normal: rn, rod_happy: rh, matt_normal: mn, matt_suspicious: ms });
    IMG.alienP = alienPortrait();
    // in the campaign you already tapped to get here: skip the title card
    if (DDT.inCampaign() && !started) { started = true; runFrom(Math.max(0, ORDER.indexOf(DDT.param('scene')))); }
    requestAnimationFrame(frame);
  });
</script>
