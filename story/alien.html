<script>
DDT.root = '../';
DDTMusic.play('spooky');
// =====================================================================
// STORY JOB: OUT OF THIS WORLD — Rod gets abducted to fix a space toilet.
// Scenes can be opened directly for testing: alien.html?scene=window|beam|lang|toilet|cable|reveal|dropoff
// =====================================================================
const W = 480, H = 270, cv = document.getElementById('c');
let g = cv.getContext('2d');
const SCALE = 3;   // draw at 3x so text is sharp; all game coordinates stay 480x270
g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.imageSmoothingEnabled = false;
const FONT = n => `${n < 6 ? n + 1 : n}px "Press Start 2P", monospace`;   // nothing smaller than 5px
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const E = (x, y, rx, ry, c, rot = 0) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); };
function T(s, x, y, c = '#fff', n = 8, al = 'left', sh = true) {
  g.font = FONT(n); g.textAlign = al; g.textBaseline = 'middle';
  if (sh) { g.fillStyle = '#000'; g.fillText(s, x + 1, y + 1); }
  g.fillStyle = c; g.fillText(s, x, y);
}
function wrap(s, maxW, n = 8) {
  g.font = FONT(n); const out = []; let line = '';
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
// portraits not preloaded (rod_angry, ron_smug...) load the first time someone uses that face
const _portBase = (() => { const e = document.querySelector('script[src*="js/state.js"]'); return e ? e.src.replace(/js\/state\.js.*$/, 'assets/') : '../assets/'; })();
function portLoad(name) { if (!name || name in portLoad.c) return portLoad.c[name] || null; portLoad.c[name] = null; const i = new Image(); i.onload = () => { portLoad.c[name] = IMG[name] = i; }; i.src = _portBase + name + '.png'; return null; }
portLoad.c = {};
const IMG = {};
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- sound (Web Audio, unlocked on first tap) ----------
let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, d, type = 'square', vol = 0.05, at = 0, f2 = null) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), v = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
const SND = {
  chirp(n = 3) { for (let i = 0; i < n; i++) tone(rnd(700, 1500), 0.07, 'square', 0.035, i * 0.09, rnd(500, 1800)); },
  blip() { tone(880, 0.05, 'square', 0.03); },
  good() { tone(660, 0.08, 'square', 0.04); tone(990, 0.12, 'square', 0.04, 0.08); },
  bad() { tone(220, 0.25, 'sawtooth', 0.04, 0, 140); },
  beam() { tone(90, 2.6, 'sawtooth', 0.03, 0, 260); tone(180, 2.6, 'triangle', 0.03, 0, 520); },
  gurgle() { for (let i = 0; i < 8; i++) tone(rnd(70, 140), 0.12, 'triangle', 0.06, i * 0.1, rnd(40, 90)); },
  flush() { tone(400, 1.2, 'sawtooth', 0.04, 0, 40); tone(1200, 0.8, 'triangle', 0.02, 0.1, 100); },
  snag() { tone(160, 0.15, 'square', 0.05, 0, 90); },
  ding() { tone(1320, 0.3, 'triangle', 0.05); tone(1760, 0.4, 'triangle', 0.04, 0.12); },
};
if (typeof DDTSfx !== 'undefined') {
  DDTSfx.patch(SND);   // recorded sounds where we have them
  SND.chirp = (n = 3) => DDTSfx.play('alien_voice', { offset: Math.random() * 13, dur: Math.min(2.4, 0.35 + n * 0.3) });   /* a slice of the alien talking */
  SND.beam = () => DDTSfx.play('teleporter');
}
// background bed for each scene (kept quiet). amb('x') swaps it, amb() stops it.
let AMB = null, AMBN = '';
function amb(name, vol = 1) { if (AMBN === name) return; if (AMB) AMB.stop(); AMB = null; AMBN = name || ''; if (name && typeof DDTSfx !== 'undefined') AMB = DDTSfx.loop(name, { vol }); }

// ---------- input ----------
const keys = {}, hit = {};
addEventListener('keydown', e => { if (!keys[e.key]) hit[e.key] = true; keys[e.key] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); ac(); });
addEventListener('keyup', e => { keys[e.key] = false; });
const ptr = { x: 0, y: 0, down: false, clicked: false, released: false };
const smear = [];   // every tap leaves a brown smudge; dragging leaves a streak. Both fade away.
function toCanvasXY(cx, cy) { const b = cv.getBoundingClientRect(); ptr.x = (cx - b.left) / b.width * W; ptr.y = (cy - b.top) / b.height * H; }
function toCanvas(e) { toCanvasXY(e.clientX, e.clientY); }
// Phones: listen to touch AND pointer events and take whichever arrives first. Some phones drop the first
// pointer events after a page change; touch events still come through, so a tap always registers.
let lastDown = 0;
const fp = (x, y, t) => ({ x, y, t, dot: true, rot: Math.random() * Math.PI, sc: 0.8 + Math.random() * 0.5, sk: 0.6 + Math.random() * 0.25, seed: Math.random() * 1000 });
function pDown(cx, cy) { const n = performance.now(); if (n - lastDown < 250 && ptr.down) return; lastDown = n; toCanvasXY(cx, cy); ptr.down = true; ptr.clicked = true; ptr.released = false; ac(); smear.push(fp(ptr.x, ptr.y, n)); }
function pMove(cx, cy) { toCanvasXY(cx, cy); if (ptr.down) { const l = smear[smear.length - 1]; if (!l || Math.hypot(l.x - ptr.x, l.y - ptr.y) > 2) smear.push({ x: ptr.x, y: ptr.y, t: performance.now(), px: l ? l.x : ptr.x, py: l ? l.y : ptr.y }); } }
function pUp() { if (ptr.down) ptr.released = true; ptr.down = false; }
let touchId = null;   // only the first finger draws a streak; extra fingers just smudge where they land
cv.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0];
  if (touchId === null || ![...e.touches].some(q => q.identifier === touchId)) { touchId = t.identifier; pDown(t.clientX, t.clientY); }
  else { const b = cv.getBoundingClientRect(); smear.push(fp((t.clientX - b.left) / b.width * W, (t.clientY - b.top) / b.height * H, performance.now())); } }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); const t = [...e.changedTouches].find(q => q.identifier === touchId); if (t) pMove(t.clientX, t.clientY); }, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); if ([...e.changedTouches].some(q => q.identifier === touchId)) { touchId = null; pUp(); } }, { passive: false });
cv.addEventListener('touchcancel', () => { touchId = null; pUp(); });
cv.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; pDown(e.clientX, e.clientY); });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; pMove(e.clientX, e.clientY); });
addEventListener('pointerup', e => { if (e.pointerType !== 'touch') pUp(); });
const pressed = k => hit[k];
const confirmHit = () => hit[' '] || hit['Enter'] || hit['z'] || hit['Z'];
const inBox = (x, y, w, h) => ptr.x >= x && ptr.x <= x + w && ptr.y >= y && ptr.y <= y + h;

// ---------- scene runner: every wait/line/tween can be cancelled by SKIP ----------
let RUN = 0, pend = new Set(), tweens = [], dialog = null, game = null, view = () => {}, st = {};
function cancellable(exec) {
  return new Promise((res, rej) => { const h = { rej }; pend.add(h); exec(v => { if (pend.has(h)) { pend.delete(h); res(v); } }); });
}
function cancelAll() { pend.forEach(h => h.rej('skip')); pend.clear(); tweens = []; dialog = null; game = null; }
const wait = ms => cancellable(res => setTimeout(res, ms));
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function tween(o, k, to, ms, fn = ease) { return cancellable(res => tweens.push({ o, k, from: o[k], to, ms, t: 0, fn, res })); }
function alienSay(ids, labels = null) {   /* the alien's lines go in the dialog box like everyone else's, and wait for a tap */
  SND.chirp(ids.length + 1);
  return cancellable(res => { dialog = { name: '???', port: 'alien', text: '#'.repeat(ids.length * 5), glyphs: ids, labels, shown: 0, sel: 0, res }; });
}
function say(name, port, text, opts) { return cancellable(res => { dialog = { name, port, text, shown: 0, opts, sel: 0, res }; }); }
function play(gm) { return cancellable(res => { game = gm; gm.done = v => { game = null; res(v); }; gm.init && gm.init(); }); }
async function card(lines, ms = 2200, col = '#f7c418') { st.card = lines; st.cardCol = col; await tween(st, 'cardA', 1, 400); await wait(ms); await tween(st, 'cardA', 0, 400); }
const fadeIn = (ms = 600) => tween(st, 'fade', 0, ms), fadeOut = (ms = 600) => tween(st, 'fade', 1, ms);

const ORDER = ['window', 'beam', 'lang', 'toilet', 'cable', 'reveal', 'dropoff'];
const NAMES = { window: 'THE WINDOW', beam: 'BEAM ME UP', lang: 'LEARN THE LINGO', toilet: 'THE SPACE TOILET', cable: 'CABLE THE HOSE', reveal: 'THE CULPRIT', dropoff: 'THE DROP-OFF' };
let cur = 0, score = { wrong: 0, retries: 0, snags: 0 };
try { const k = JSON.parse(sessionStorage.getItem('ddt_alien_score') || 'null'); if (k && /scene=reveal/.test(location.search)) score = k; } catch (e) {}   /* carried across the trip to the arcade */
async function runFrom(i) {
  cancelAll(); const tok = ++RUN;
  for (; i < ORDER.length; i++) {
    cur = i; st = { fade: 1, cardA: 0 }; view = () => R(0, 0, W, H, '#000');
    try { await SCENES[ORDER[i]](); } catch (e) { if (e !== 'skip') console.error(e); return; }
    if (tok !== RUN) return;
  }
  DDT.nav(DDT.back('index.html'));
}

// ---------- characters ----------

// crew in cutscenes: when they're moving sideways, play the real walk cycle (and face the way they're going)
const CREW_MV = {};
function crewSheet(n) { if (IMG[n] === undefined) { IMG[n] = null; const im = new Image(); im.onload = () => IMG[n] = im; im.src = '../assets/' + n + '.png'; } return IMG[n]; }
function crewDraw(who, x, y, f, s, a) {
  const base = IMG[who]; if (!base) return; g.globalAlpha = a;
  const now = performance.now(), p = CREW_MV[who + s] || (CREW_MV[who + s] = { x, mv: 0, dir: 1 }), dx = x - p.x;
  if (Math.abs(dx) > 0.05) { p.mv = now; p.dir = dx > 0 ? 1 : -1; } p.x = x;
  let I = base, fi = f, fw = base.width / 9, flip = false;
  const more = crewSheet(who + '_more');
  if (now - p.mv < 140 && more && (f === 0 || f === 6 || f === 8)) { I = more; fw = more.width / 9; fi = Math.floor(now / 125) % 4; flip = p.dir < 0; }   // walking, not sliding
  const q = who === 'rod' ? 0.94 : 1, w = 24 * s * q, h = 40 * s * q;   /* Matt stands a little taller than Rod */
  g.imageSmoothingEnabled = fw > 24;
  if (flip) { g.save(); g.translate(Math.round(x), 0); g.scale(-1, 1); g.drawImage(I, fi * fw, 0, fw, I.height, Math.round(-w / 2), Math.round(y - h), w, h); g.restore(); }
  else g.drawImage(I, fi * fw, 0, fw, I.height, Math.round(x - w / 2), Math.round(y - h), w, h);
  g.imageSmoothingEnabled = false;
}
function rodBed(lie, dy = 0) {
  const up = (1 - lie) * 7;   /* the covers come up with him when he sits up */   /* hip under the covers at (200,194); lie 1 = flat on his back, head on the pillow; 0 = sitting up facing the window */
  const I = IMG.rod; if (!I) return; const fw = I.width / 9, w = 24 * 2 * 0.94, h = 40 * 2 * 0.94;
  g.save(); g.beginPath(); g.rect(0, 0, 188, H); g.rect(188, 0, W, 186 - up); g.clip();   /* only what's outside the blanket shows */
  g.translate(200, 194 + dy); g.rotate(-Math.PI / 2 * lie); g.imageSmoothingEnabled = true;
  g.drawImage(I, 6 * fw, 0, fw, I.height, -w / 2, -h * 0.56, w, h);
  const P = (fx, fy) => [-w / 2 + fx * w, -h * 0.56 + fy * h];   /* sleep mask: over his eyes asleep, pulled down around his neck once he's up */
  if (lie > 0.5) { const [x0, y0] = P(0.40, 0.205), [x1] = P(0.65, 0); R(x0, y0, x1 - x0, 3.2, '#2b2b3d'); R(x0 + 4, y0, x1 - x0 - 4, 0.8, '#55557a'); }
  else { const [x0, y0] = P(0.46, 0.335), [x1] = P(0.60, 0); R(x0, y0, x1 - x0, 2.2, '#2b2b3d'); }
  g.restore(); g.imageSmoothingEnabled = false;
}
function rod(x, y, f = 0, s = 2, a = 1) {      // x,y = feet, center
  crewDraw('rod', x, y, f, s, a); g.globalAlpha = 1;
}
// gray alien. o: {s, wave, point:[tx,ty], tilt, blink, sad}
function alien(x, y, o = {}) {
  if (ART.alien) {   /* poses: 0 idle 1 blink 2 point 3 tilt 4 impatient 5 angry 6 furious 7 satisfied */
    const t = performance.now() / 1000; let f = 0, flip = false;
    if (o.angry >= 3) f = 6; else if (o.angry === 2) f = 5; else if (o.angry === 1) f = 4;
    else if (o.happy) f = 7; else if (o.point || o.wave) { f = 2; if (o.point && o.point[0] > x) flip = true; }
    else if (o.tilt) f = 3; else if (o.blink || t % 4 < 0.14) f = 1;
    const shake = f >= 5 ? Math.sin(t * 40) * 0.8 : 0, bob = o.wave ? Math.sin(t * 6) * 2 : 0;
    spr('alien', f, x + shake, y + bob, 72 * (o.s || 1.4) / 1.4, { flip }); return;
  }
  const s = o.s || 1, t = performance.now() / 1000;
  g.save(); g.translate(x, y); g.scale(s, s);
  // body
  R(-7, -34, 14, 22, '#8d9a8a'); R(-6, -12, 5, 12, '#7c8879'); R(1, -12, 5, 12, '#7c8879');
  R(-8, -34, 16, 3, '#6b7a68');
  // arms
  g.strokeStyle = '#8d9a8a'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-7, -30); g.lineTo(-12, -16); g.stroke();
  if (o.point) {
    const [tx, ty] = o.point, ang = Math.atan2((ty - y) / s + 30, (tx - x) / s - 7);
    g.beginPath(); g.moveTo(7, -30); g.lineTo(7 + Math.cos(ang) * 16, -30 + Math.sin(ang) * 16); g.stroke();
    g.lineWidth = 1.5; g.beginPath(); g.moveTo(7 + Math.cos(ang) * 16, -30 + Math.sin(ang) * 16); g.lineTo(7 + Math.cos(ang) * 23, -30 + Math.sin(ang) * 23); g.stroke();
  } else if (o.wave) {
    const a = -1.9 + Math.sin(t * 6) * 0.35;
    g.beginPath(); g.moveTo(7, -30); g.lineTo(7 + Math.cos(a) * 12, -30 + Math.sin(a) * 12); g.stroke();
    g.lineWidth = 1.5; const b = a + Math.sin(t * 9) * 0.6;
    g.beginPath(); g.moveTo(7 + Math.cos(a) * 12, -30 + Math.sin(a) * 12); g.lineTo(7 + Math.cos(a) * 12 + Math.cos(b - 0.6) * 7, -30 + Math.sin(a) * 12 + Math.sin(b - 0.6) * 7); g.stroke();
  } else { g.beginPath(); g.moveTo(7, -30); g.lineTo(12, -16); g.stroke(); }
  // head
  g.translate(0, -46); g.rotate(o.tilt || 0);
  E(0, 0, 13, 15, '#a3b19f'); E(0, 6, 8, 9, '#a3b19f'); R(-2, 13, 4, 3, '#8d9a8a');
  const blink = o.blink || (t % 4 < 0.12);
  if (blink) { R(-10, 1, 7, 2, '#111'); R(3, 1, 7, 2, '#111'); }
  else { E(-6, 1, 5.5, 3.5, '#0b0b10', 0.45); E(6, 1, 5.5, 3.5, '#0b0b10', -0.45); R(-8, -1, 2, 1, '#fff'); R(4, -1, 2, 1, '#fff'); }
  if (o.sad) R(-3, 11, 6, 1, '#556');
  g.restore();
}
function alienPortrait() {
  const c = document.createElement('canvas'); c.width = c.height = 80; const k = c.getContext('2d');
  k.fillStyle = '#2a1f4a'; k.fillRect(0, 0, 80, 80); k.fillStyle = '#3a2d63'; for (let i = 0; i < 80; i += 8) k.fillRect(0, i, 80, 2);
  const save = g; g = k; alien(40, 128, { s: 2.2, blink: false }); g = save; return c;
}
// alien words are drawn as 5x5 pixel glyphs
const GLYPH = {
  you:    ['10001', '01010', '00100', '01010', '10001'],
  me:     ['01110', '10001', '10101', '10001', '01110'],
  toilet: ['11111', '10001', '01110', '00100', '01110'],
  broken: ['10100', '01011', '00100', '11010', '00101'],
  fix:    ['00011', '00111', '01110', '11100', '11000'],
  home:   ['00100', '01110', '11111', '01010', '01110'],
  no:     ['11011', '11011', '00000', '11011', '11011'],
};
function glyph(id, x, y, px = 3, col = '#7dffb0') {
  const m = GLYPH[id]; for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) if (m[r][c] === '1') R(x + c * px, y + r * px, px, px, col);
}
function bubble(x, y, ids, px = 3, label = null) {
  const w = ids.length * (px * 5 + px * 3) + px * 3, h = px * 5 + px * 6 + (label ? 12 : 0);
  R(x - w / 2, y - h, w, h, '#0d1a14'); g.strokeStyle = '#7dffb0'; g.lineWidth = 1; g.strokeRect(Math.round(x - w / 2) + 0.5, Math.round(y - h) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
  ids.forEach((id, i) => glyph(id, x - w / 2 + px * 3 + i * (px * 8), y - h + px * 3, px));
  if (label) label.forEach((l, i) => T(l, x - w / 2 + px * 3 + i * (px * 8) + px * 2.5, y - 9, '#f7c418', 5, 'center', false));
}

// ---------- painted art (assets/alien) ----------
const ART = {};
['alien', 'port', 'ufo', 'sparks', 'toilet'].forEach(n => { const i = new Image(); i.onload = () => ART[n] = i; i.src = '../assets/alien/' + n + '.png'; });
['bg_yard', 'bg_ship', 'bg_yard_dawn'].forEach(n => { const i = new Image(); i.onload = () => ART[n] = i; i.src = '../assets/alien/' + n + '.jpg'; });
{ const i = new Image(); i.onload = () => ART.bg_bedroom = i; i.src = '../assets/alien/bg_bedroom.webp'; }
const CELLS = { alien: 8, port: 3, ufo: 3, sparks: 6, toilet: 6 };
// draw cell i of a strip, centered on x, bottom at y (or centered when mid), h tall
function spr(n, i, x, y, h, o = {}) {
  const im = ART[n]; if (!im) return false; const cw = im.width / CELLS[n], w = h * cw / im.height;
  g.save(); g.imageSmoothingEnabled = true; if (o.a !== undefined) g.globalAlpha = o.a;
  g.translate(x, o.mid ? y : y - h / 2); if (o.rot) g.rotate(o.rot); if (o.flip) g.scale(-1, 1);
  g.drawImage(im, i * cw, 0, cw, im.height, -w / 2, -h / 2, w, h); g.restore(); return true;
}
function bg(n) { const im = ART[n]; if (!im) return false; g.save(); g.imageSmoothingEnabled = true; g.drawImage(im, 0, 0, W, H); g.restore(); return true; }

// ---------- backdrops ----------
const STARS = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * 170, Math.random()]);
function stars(clip) { const t = performance.now() / 1000; STARS.forEach(([x, y, p]) => { if (!clip || clip(x, y)) R(x, y, 1, 1, (Math.sin(t * 2 + p * 9) > 0.6) ? '#fff' : '#8aa0d0'); }); }

// ---- CABLE THE HOSE (mini-game) ----
const LEN = 2300, SPD = 70, HX = 130;
const yc = x => 128 + 42 * Math.sin(x / 150) + 18 * Math.sin(x / 57 + 1);
const hw = x => Math.max(26, 32 + 7 * Math.sin(x / 95));
const CableGame = {
  init() {
    this.d = 0; this.y = yc(HX); this.snags = 0; this.stall = 0; this.trail = []; this.t = 0; this.junk = []; this.max = 6; this.hitT = 0; this.ready = 2;
    for (let x = 420, s = 1; x < LEN - 140; x += rnd(150, 230), s = -s) this.junk.push({ x, off: s * 0.5, r: 6, kind: Math.floor(rnd(0, 3)) });
  },
  update(dt) {
    this.t += dt; if (this.ready > 0) { if (ptr.clicked || confirmHit()) this.ready = 0; return; }   // instructions stay up until you're ready
    this.stall = Math.max(0, this.stall - dt); this.hitT = Math.max(0, this.hitT - dt);
    const v = this.stall > 0 ? 0 : SPD; this.d = Math.min(LEN, this.d + v * dt);
    const wx = this.d + HX, rate = 120;
    let dy = 0; if (keys.ArrowUp || keys.w || keys.W) dy -= 1; if (keys.ArrowDown || keys.s || keys.S) dy += 1;
    if (ptr.down && !dy) { const diff = ptr.y - this.y; dy = Math.abs(diff) < 2 ? 0 : Math.sign(diff); }
    this.y += dy * rate * dt;
    this.trail.push([wx, this.y]); if (this.trail.length > 400) this.trail.shift();
    const c = yc(wx), w = hw(wx);
    let snag = Math.abs(this.y - c) > w - 5;
    for (const j of this.junk) if (!j.hit && Math.abs(j.x - wx) < j.r + 4 && Math.abs(yc(j.x) + j.off * hw(j.x) - this.y) < j.r + 4) { j.hit = true; snag = true; }
    if (snag && this.hitT <= 0) { this.snags++; score.snags++; this.stall = 0.6; this.hitT = 1.0; SND.snag(); }
    if (Math.abs(this.y - c) > w - 4) this.y = c + Math.sign(this.y - c) * (w - 6);
    if (this.snags >= this.max) return this.done('kink');
    if (this.d >= LEN) { SND.ding(); this.done('ok'); }
  },
  draw() {
    R(0, 0, W, H, '#120d24');
    for (let x = 0; x < W; x += 40) R(x, 0, 2, H, '#181232');
    for (let sx = 0; sx < W; sx += 2) {
      const wx = this.d + sx, c = yc(wx), w = hw(wx);
      R(sx, c - w - 5, 2, 5, '#8a93a5'); R(sx, c + w, 2, 5, '#8a93a5');
      R(sx, c - w, 2, w * 2, '#241c3e');
      if (Math.floor(wx / 14) % 2 === 0) { R(sx, c - w - 5, 2, 2, '#a9b2c4'); R(sx, c + w + 3, 2, 2, '#a9b2c4'); }
    }
    const gx = LEN + HX - this.d + 20;
    if (gx < W + 40) { for (let i = 0; i < 9; i++) E(gx + (i % 3) * 7, yc(LEN + HX + 20) - 12 + i * 3, 9, 7, i % 2 ? '#5a3a1c' : '#6b4423'); T('CLOG', gx + 8, yc(LEN + HX + 20) - 30, '#f7c418', 6, 'center'); }
    for (const j of this.junk) {
      const sx = j.x - this.d, y = yc(j.x) + j.off * hw(j.x); if (sx < -10 || sx > W + 10) continue;
      if (j.kind === 0) E(sx, y, j.r + 1, j.r, j.hit ? '#3c5a3c' : '#7dffb0');
      if (j.kind === 1) { R(sx - 6, y - 4, 12, 8, j.hit ? '#555' : '#c0c8d8'); R(sx - 3, y - 2, 6, 4, '#2c6cd6'); }
      if (j.kind === 2) { E(sx, y, 6, 6, j.hit ? '#555' : '#e9665a'); R(sx - 1, y - 9, 2, 4, '#e9665a'); }
    }
    g.strokeStyle = '#d0d0d0'; g.lineWidth = 3; g.beginPath(); let first = true;
    for (const [x, y] of this.trail) { const sx = x - this.d; if (sx < -4) continue; if (first) { g.moveTo(sx, y); first = false; } else g.lineTo(sx, y); }
    g.stroke();
    const sp = this.t * (this.stall > 0 ? 2 : 24);
    R(HX - 2, this.y - 5, 10, 10, this.hitT > 0 && Math.floor(this.t * 16) % 2 ? '#e9665a' : '#f7c418');
    R(HX + 8, this.y - 3 + Math.round(Math.sin(sp) * 2), 4, 6, '#fff');
    R(0, 0, W, 22, '#10151fdd');
    T('CABLE THE HOSE', 8, 11, '#f7c418', 7);
    R(140, 7, 200, 8, '#2c3326'); R(140, 7, 200 * this.d / LEN, 8, '#7bd65b');
    T('SNAGS', 360, 11, '#fff', 6); for (let i = 0; i < this.max; i++) R(404 + i * 11, 6, 8, 9, i < this.snags ? '#e9665a' : '#333');
    if (this.ready > 0) { R(120, 96, 240, 70, '#10151fee'); T('STEER THE CABLE TO THE CLOG', 240, 114, '#f7c418', 7, 'center'); T('UP / DOWN  ·  OR HOLD WHERE YOU WANT IT', 240, 134, '#fff', 5, 'center'); T("DON'T SNAG THE WALLS OR THE JUNK", 240, 150, '#fff', 5, 'center'); if (Math.floor(this.t * 2.5) % 2) T('TAP TO START', 240, 176, '#f7c418', 7, 'center'); }
  },
};

// =====================================================================
// main loop
// =====================================================================
let last = performance.now(), started = false;
function frame(now) {
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.imageSmoothingEnabled = false;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const tw of tweens.slice()) {
    tw.t += dt * 1000; const p = Math.min(1, tw.t / tw.ms); tw.o[tw.k] = tw.from + (tw.to - tw.from) * tw.fn(p);
    if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  // buttons first
  if (started && ptr.clicked && inBox(...BTN.menu)) { DDT.nav(DDT.root + (DDT.inCampaign() ? 'play.html' : 'index.html')); return; }
  if (started && DDT.DEV && ptr.clicked && inBox(...BTN.skip)) { ptr.clicked = false; runFrom(cur + 1); }
  if (!started) {
    R(0, 0, W, H, '#05070c'); stars();
    T('STORY JOB', 240, 90, '#9fb3d9', 8, 'center'); T('OUT OF THIS WORLD', 240, 116, '#f7c418', 16, 'center');
    if (Math.floor(now / 500) % 2) T('TAP TO START', 240, 170, '#fff', 8, 'center');
    if (ptr.clicked || confirmHit()) { started = true; ac(); const q = new URLSearchParams(location.search).get('scene'); runFrom(Math.max(0, ORDER.indexOf(q))); }
  } else {
    view();
    if (game) { const gm = game; gm.update(dt); gm.draw(); }   // update may finish the game and clear it
    else if (!dialogInput() && st.waitTap && (ptr.clicked || confirmHit())) { const f = st.waitTap; st.waitTap = null; f(); }
    drawDialog();
    if (st.cardA > 0) { g.globalAlpha = st.cardA; const CL = st.card.flatMap(l => wrap(String(l), 450, 9)); R(0, 80, W, 34 + (CL.length - 1) * 16, '#000000cc'); CL.forEach((l, i) => T(l, 240, 98 + i * 16, st.cardCol, 9, 'center')); g.globalAlpha = 1; }
    if (st.fade > 0) { g.globalAlpha = st.fade; R(0, 0, W, H, '#000'); g.globalAlpha = 1; }
    { const nowT = performance.now(); while (smear.length && nowT - smear[0].t > 900) smear.shift();
      for (const m of smear) { const a = 0.85 * (1 - (nowT - m.t) / 900);
        if (m.dot) {   // a brown fingerprint: smeared pad, swirly ridges, a few flecks. Every one is a little different.
          let r = m.seed; const rn = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
          g.save(); g.translate(m.x, m.y); g.rotate(m.rot); g.scale(m.sc, m.sc);
          g.globalAlpha = a * 0.55; E(0, 0, 13, 13 * m.sk + 4, '#6b4a2a');
          g.globalAlpha = a; g.strokeStyle = '#3e2712'; g.lineWidth = 1.6; g.lineCap = 'round';
          const cx = (rn() - 0.5) * 3, cy = (rn() - 0.5) * 3;
          for (let k = 0; k < 6; k++) { const rx = 2.5 + k * 2.1, ry = rx * (m.sk + 0.25), a0 = rn() * 6.28, sweep = 3.6 + rn() * 2.2;
            g.beginPath(); g.ellipse(cx, cy + k * 0.6, rx, ry, 0, a0, a0 + sweep); g.stroke(); }
          g.fillStyle = '#4a2e16'; for (let k = 0; k < 4; k++) { const ang = rn() * 6.28, d = 15 + rn() * 7; E(Math.cos(ang) * d, Math.sin(ang) * d, 1 + rn() * 2, 0.8 + rn() * 1.5, '#4a2e16'); }
          g.restore();
        }
        else { g.globalAlpha = a; g.strokeStyle = '#5a3a1e'; g.lineWidth = 13; g.lineCap = 'round'; g.beginPath(); g.moveTo(m.px, m.py); g.lineTo(m.x, m.y); g.stroke(); } }
      g.globalAlpha = 1; }
    drawButtons();
  }
  ptr.clicked = false; ptr.released = false; for (const k in hit) delete hit[k];
  requestAnimationFrame(frame);
}
