<script>
DDT.root = '../';
DDTMusic.play('van');   // you pull in with the van radio on; it goes off when the door shuts
// =====================================================================
// BREAKFAST STOP: CORE SHOT COFFEE BAR (Gorham). Scenes: coffee.html?scene=arrive|order|leave
// =====================================================================
const W = 480, H = 270, cv = document.getElementById('c');
let g = cv.getContext('2d');
let SCALE = 3;   // at least 3x; on a phone it matches the screen's real pixels so hi-res art stays sharp. All game coordinates stay 480x270
const fitRes = () => { const b = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; SCALE = Math.max(3, b.width * d / 480); const w = Math.round(480 * SCALE), h = Math.round(270 * SCALE); if (cv.width !== w) { cv.width = w; cv.height = h; } };
fitRes(); addEventListener('resize', fitRes);
g.setTransform(SCALE, 0, 0, SCALE, 0, 0); g.imageSmoothingEnabled = false;
const FONT = n => `${n < 6 ? n + 1 : n}px "Press Start 2P", monospace`;   // nothing smaller than 5px
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

  g.font = FONT(n); g.textAlign = al; g.textBaseline = 'middle';
  if (sh) { g.fillStyle = '#000'; g.fillText(s, x + 1, y + 1); }
  g.fillStyle = c; g.fillText(s, x, y);
}
function wrap(s, maxW, n = 8) {

  if (line) out.push(line); return out;
}
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
// portraits not preloaded (rod_angry, ron_smug...) load the first time someone uses that face
const _portBase = (() => { const e = document.querySelector('script[src*="js/state.js"]'); return e ? e.src.replace(/js\/state\.js.*$/, 'assets/') : '../assets/'; })();
function portLoad(name) { if (!name || name in portLoad.c) return portLoad.c[name] || null; portLoad.c[name] = null; const i = new Image(); i.onload = () => { portLoad.c[name] = IMG[name] = i; }; i.src = _portBase + name + '.png'; return null; }
portLoad.c = {};
const PORT_WARM = ["dookies_barista", "grant_happy", "grant_normal", "grant_panic", "kevin_laugh", "kevin_normal", "matt_happy", "matt_normal", "matt_shocked", "matt_stare", "matt_suspicious", "matt_tired", "rod_angry", "rod_annoyed", "rod_confused", "rod_gross", "rod_happy", "rod_laugh", "rod_normal", "rod_panic", "rod_phone", "rod_sad", "rod_shocked", "rod_smug", "rod_stare", "rod_suspicious", "rod_tight", "rod_tight_stare", "rod_tired", "ron_angry", "ron_annoyed", "ron_confused", "ron_cover", "ron_gross", "ron_happy", "ron_laugh", "ron_neutral", "ron_panic", "ron_phone", "ron_sad", "ron_shocked", "ron_smug", "ron_stare", "ron_suspicious", "ron_tired"];   // every face loads up front, so nobody's portrait pops in late
PORT_WARM.forEach(n => portLoad(n));
const IMG = {};
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- sound (Web Audio, unlocked on first tap) ----------
let AC = null;
function ac() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, d, type = 'square', vol = 0.05, at = 0, f2 = null) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), v = a.createGain(), t = a.currentTime + at;

const SND = {
  chirp(n = 3) { for (let i = 0; i < n; i++) tone(rnd(700, 1500), 0.07, 'square', 0.035, i * 0.09, rnd(500, 1800)); },
  blip() { tone(880, 0.05, 'square', 0.03); },
  good() { tone(660, 0.08, 'square', 0.04); tone(990, 0.12, 'square', 0.04, 0.08); },
  bad() { tone(220, 0.25, 'sawtooth', 0.04, 0, 140); },
  beam() { tone(90, 2.6, 'sawtooth', 0.03, 0, 260); tone(180, 2.6, 'triangle', 0.03, 0, 520); },
  gurgle() { for (let i = 0; i < 8; i++) tone(rnd(70, 140), 0.12, 'triangle', 0.06, i * 0.1, rnd(40, 90)); },

  snag() { tone(160, 0.15, 'square', 0.05, 0, 90); },

};
if (typeof DDTSfx !== 'undefined') DDTSfx.patch(SND);   // recorded sounds where we have them

// ---------- input ----------
const keys = {}, hit = {};
addEventListener('keydown', e => { if (!keys[e.key]) hit[e.key] = true; keys[e.key] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); ac(); });
addEventListener('keyup', e => { keys[e.key] = false; });
const ptr = { x: 0, y: 0, down: false, clicked: false, released: false };
const smear = [];   // every tap leaves a brown smudge; dragging leaves a streak. Both fade away.
function toCanvasXY(cx, cy) { const b = cv.getBoundingClientRect(); ptr.x = (cx - b.left) / b.width * W; ptr.y = (cy - b.top) / b.height * H; }

// Phones: listen to touch AND pointer events and take whichever arrives first. Some phones drop the first
// pointer events after a page change; touch events still come through, so a tap always registers.

let touchId = null;   // only the first finger draws a streak; extra fingers just smudge where they land

const pressed = k => hit[k];
const confirmHit = () => hit[' '] || hit['Enter'] || hit['z'] || hit['Z'];
const inBox = (x, y, w, h) => ptr.x >= x && ptr.x <= x + w && ptr.y >= y && ptr.y <= y + h;

// ---------- scene runner: every wait/line/tween can be cancelled by SKIP ----------
let RUN = 0, pend = new Set(), tweens = [], dialog = null, game = null, view = () => {}, st = {};
function cancellable(exec) {

function say(name, port, text, opts) { return cancellable(res => { dialog = { name, port, text, shown: 0, opts, sel: 0, res }; }); }

const fadeIn = (ms = 600) => tween(st, 'fade', 0, ms), fadeOut = (ms = 600) => tween(st, 'fade', 1, ms);

const ORDER = ['arrive', 'order', 'leave'];
const NAMES = { arrive: 'PULL IN', order: 'ORDER UP', leave: 'BACK ON THE ROAD' };
let cur = 0, score = { wrong: 0, retries: 0, snags: 0 };
async function runFrom(i) {
  cancelAll(); const tok = ++RUN;
  for (; i < ORDER.length; i++) {
    cur = i; st = { fade: 1, cardA: 0 }; view = () => R(0, 0, W, H, '#000');
    try { await SCENES[ORDER[i]](); } catch (e) { if (e !== 'skip') console.error(e); return; }
    if (tok !== RUN) return;
  }
  DDT.nav(DDT.back('index.html'));
}

// ---------- characters ----------

// crew in cutscenes: when they're moving sideways, play the real walk cycle (and face the way they're going)
const CREW_MV = {};
function crewSheet(n) { if (IMG[n] === undefined) { IMG[n] = null; const im = new Image(); im.onload = () => IMG[n] = im; im.src = '../assets/' + n + '.png'; } return IMG[n]; }
function crewDraw(who, x, y, f, s, a) {

}
// gray alien. o: {s, wave, point:[tx,ty], tilt, blink, sad}
function alien(x, y, o = {}) {

  R(-8, -34, 16, 3, '#6b7a68');

  g.beginPath(); g.moveTo(-7, -30); g.lineTo(-12, -16); g.stroke();

function alienPortrait() {
  const c = document.createElement('canvas'); c.width = c.height = 80; const k = c.getContext('2d');
  k.fillStyle = '#2a1f4a'; k.fillRect(0, 0, 80, 80); k.fillStyle = '#3a2d63'; for (let i = 0; i < 80; i += 8) k.fillRect(0, i, 80, 2);

// alien words are drawn as 5x5 pixel glyphs
const GLYPH = {

  me:     ['01110', '10001', '10101', '10001', '01110'],
  toilet: ['11111', '10001', '01110', '00100', '01110'],
  broken: ['10100', '01011', '00100', '11010', '00101'],
  fix:    ['00011', '00111', '01110', '11100', '11000'],

  if (label) label.forEach((l, i) => T(l, x - w / 2 + px * 3 + i * (px * 8) + px * 2.5, y - 9, '#f7c418', 5, 'center', false));

// ---------- backdrops ----------
const STARS = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * 170, Math.random()]);
function stars(clip) { const t = performance.now() / 1000; STARS.forEach(([x, y, p]) => { if (!clip || clip(x, y)) R(x, y, 1, 1, (Math.sin(t * 2 + p * 9) > 0.6) ? '#fff' : '#8aa0d0'); }); }
function bedroom(dawn = false) {
  R(0, 0, W, H, dawn ? '#3a3046' : '#161c30');
  for (let x = 0; x < W; x += 24) R(x, 0, 2, 200, dawn ? '#40354e' : '#1a2138');
  R(0, 200, W, 70, '#2a2030'); for (let x = 0; x < W; x += 40) R(x, 200, 1, 70, '#33283b');
  // window
  const wx = 320, wy = 46, ww = 92, wh = 88;
  if (dawn) { const gr = g.createLinearGradient(0, wy, 0, wy + wh); gr.addColorStop(0, '#f2a65a'); gr.addColorStop(1, '#ffd98a'); g.fillStyle = gr; g.fillRect(wx, wy, ww, wh); }
  else { R(wx, wy, ww, wh, '#0a1030'); stars((x, y) => x > wx && x < wx + ww && y > wy && y < wy + wh); }
  R(wx + 6, wy + wh - 22, 22, 22, '#0b1a10'); R(wx + 60, wy + wh - 30, 18, 30, '#0b1a10');
  st.windowDraw && st.windowDraw(wx, wy, ww, wh);
  R(wx - 4, wy - 4, ww + 8, 4, '#6b5a40'); R(wx - 4, wy + wh, ww + 8, 6, '#6b5a40'); R(wx - 4, wy, 4, wh, '#6b5a40'); R(wx + ww, wy, 4, wh, '#6b5a40');

  R(wx - 14, wy - 8, 12, wh + 20, '#5a2e3a'); R(wx + ww + 2, wy - 8, 12, wh + 20, '#5a2e3a');
  // door
  R(16, 92, 44, 108, '#4a3826'); R(20, 96, 36, 100, '#5a4430'); R(50, 146, 4, 4, '#d6b24a');
  // TV
  const t = performance.now() / 1000, flick = dawn ? 0 : 0.5 + 0.5 * Math.sin(t * 13) * Math.sin(t * 7.3);
  R(84, 168, 54, 32, '#2a2a2a'); R(86, 128, 50, 38, '#111'); R(90, 132, 42, 30, dawn ? '#222' : `rgb(${60 + flick * 50},${90 + flick * 60},${150 + flick * 80})`);
  if (!dawn) { g.fillStyle = `rgba(120,160,255,${0.05 + flick * 0.05})`; g.beginPath(); g.moveTo(132, 132); g.lineTo(300, 110); g.lineTo(300, 230); g.lineTo(132, 162); g.fill(); }
}
function bed(front) {
  if (!front) { R(150, 150, 8, 55, '#4a3018'); R(150, 176, 160, 24, '#5a3a1e'); R(162, 160, 40, 14, '#e8e4dc'); return; }
  R(150, 170, 160, 24, '#2c4f8c'); R(150, 170, 160, 4, '#3d63a8'); for (let x = 160; x < 310; x += 22) R(x, 176, 10, 2, '#24427a');
  R(302, 160, 8, 45, '#4a3018');
}
function shipRoom() {
  R(0, 0, W, H, '#1e1638'); for (let x = 0; x < W; x += 40) { R(x, 0, 2, 200, '#2a1f4a'); R(x + 18, 20, 4, 4, '#4b3a80'); }
  R(0, 200, W, 70, '#141026'); for (let x = 0; x < W; x += 30) R(x, 200, 28, 2, '#2b2350');
  const t = performance.now() / 1000;
  for (let x = 20; x < W; x += 60) R(x, 6, 30, 3, (Math.floor(t * 3 + x) % 3) ? '#5b49a6' : '#7dffb0');
  // porthole with Earth
  E(60, 72, 30, 30, '#4b3a80'); E(60, 72, 25, 25, '#05070c'); stars((x, y) => (x - 60) ** 2 + (y - 72) ** 2 < 600);
  E(66, 78, 13, 13, '#2c6cd6'); E(62, 74, 5, 4, '#4caf50'); E(70, 82, 4, 3, '#4caf50');
